; smc-alerts — лінія-сповіщення (ADR-0114): ціна перетнула лінію → пуш у браузер (Rev 2; Telegram — за alerts.telegram_enabled).
; ОКРЕМИЙ program поза групою smc: `supervisorctl restart smc:*` його не чіпає, і навпаки — сповіщення не сліпнуть
; на рестартах графіка. Установка — docs/runbooks/production.md, розділ «Лінія-сповіщення (ADR-0114)».
; config.json:alerts.enabled=false → процес живий лише з GET /api/alerts/health {"enabled": false} (RUNNING, без
;   BACKOFF). Неготовність (нема секретів /etc/smc-v3/alerts.env, теки стану, каналу тіків) — вихід з причиною в
;   stderr → FATAL після startretries → watchdog (ADR-0106) шле ботом «Monitor» з хвостом stderr.
; umask=027: стан (alerts.json, devices.json) — 640, тека — 750, лише smc.
; Smoke: curl -s 127.0.0.1:8020/api/alerts/health ; nginx сайту → snippets/smc_alerts_location.conf.
[program:smc-alerts]
command=/opt/smc-v3/.venv/bin/python -u -m runtime.alerts --config /opt/smc-v3/config.json
directory=/opt/smc-v3
user=smc
umask=027
autostart=true
autorestart=true
startretries=5
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/smc-v3/alerts.stdout.log
stderr_logfile=/var/log/smc-v3/alerts.stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=HOME="/var/lib/smc",PYTHONUNBUFFERED="1",PATH="/opt/smc-v3/.venv/bin:/usr/local/bin:/usr/bin"
