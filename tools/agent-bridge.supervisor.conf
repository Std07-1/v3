; smc-agent-bridge — опційний адаптер для зовнішнього AI-клієнта (ADR-0090 S1).
; ОКРЕМИЙ program поза групою smc: `supervisorctl restart smc:*` його не чіпає, і навпаки.
; Установка на VPS: sudo cp tools/agent-bridge.supervisor.conf /etc/supervisor/conf.d/agent-bridge.conf
;   → у environment ЦЬОГО хоста додати AI_ONE_AGENT_BRIDGE_ENABLED="1" і ARCHI_AUTH_TOKEN="…"
;     (секрети лише на хості, не в репо; config.json = git-singleton, ADR-0090 §3.6)
;   → sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status smc-agent-bridge
; Вимкнений bridge (env="0") НЕ виходить: слухає :8010 і віддає лише /api/bridge/health {enabled:false},
;   приватні маршрути не змонтовані (404) → supervisor бачить чесний RUNNING, без BACKOFF/FATAL.
; Smoke: curl -s 127.0.0.1:8010/api/bridge/health ; nginx archi/gorn → proxy_pass 127.0.0.1:8010.
[program:smc-agent-bridge]
command=/opt/smc-v3/.venv/bin/python -u -m runtime.agent_bridge
directory=/opt/smc-v3
user=smc
umask=002
autostart=true
autorestart=true
startretries=5
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/smc-v3/agent_bridge.stdout.log
stderr_logfile=/var/log/smc-v3/agent_bridge.stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=HOME="/var/lib/smc",PYTHONUNBUFFERED="1",PATH="/opt/smc-v3/.venv/bin:/usr/local/bin:/usr/bin",AI_ONE_AGENT_BRIDGE_ENABLED="0"
