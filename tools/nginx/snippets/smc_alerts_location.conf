# /api/alerts/* — лінія-сповіщення (ADR-0114): процес smc-alerts на 127.0.0.1:8020 (config.json:alerts.port).
# Deploy: /etc/nginx/snippets/smc_alerts_location.conf + рядок `include /etc/nginx/snippets/smc_alerts_location.conf;`
#   у server-блоці aione-smc.com (поруч з location /api/v3/), далі `sudo nginx -t && sudo systemctl reload nginx`.
# Методи: GET (health, список, SSE), POST (прив'язка), PUT/DELETE (сповіщення лінії); решта — 403.
# SSE /api/alerts/events: без буферизації і з довгим read_timeout — процес шле heartbeat кожні sse_heartbeat_s
#   (25 с), бо Cloudflare рве тихе з'єднання за 100 с.
# Захист у самому процесі: cookie пристрою, X-Alerts + Origin (CSRF), ліміт на IP, тіло ≤ 4 КБ; тут — дублюючий
#   ліміт тіла і заборона кешу. X-Real-IP — справжній клієнт (realip_cloudflare.conf) для ліміту запитів процесу.
location /api/alerts {
    limit_except GET POST PUT DELETE {
        deny all;
    }

    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 30s;
    client_max_body_size 4k;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
