# nginx rate/conn limit zones for the public platform vhost (aione-smc.com).
# Deploy: /etc/nginx/conf.d/smc_limits.conf (included by nginx.conf `include conf.d/*.conf`).
# Зони працюють по $binary_remote_addr ПІСЛЯ realip_cloudflare.conf, тобто по реальному клієнту,
# а не по Cloudflare edge IP. Референси: tools/smc-nginx-v4-hardened.conf (limit_req/limit_conn).
limit_req_zone  $binary_remote_addr  zone=smc_http:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr  zone=smc_conn:10m;
limit_req_zone  $binary_remote_addr  zone=api_v3:10m  rate=2r/s;
