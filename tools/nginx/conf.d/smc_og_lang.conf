# ADR-0116 Ф3: мова прев'ю посилання — /?lang=<код> віддає dist/index.<код>.html, який пише збірка UI
# (ui_v4/og/ogVariants.ts з ui_v4/og/og_meta.json). Deploy: /etc/nginx/conf.d/smc_og_lang.conf.
# Лише 2–3 малі латинські літери (uk, en, ru, uk-UA → uk): значення стає частиною імені файлу, тож нічого
# іншого в шлях не потрапляє. Мови без файлу nginx пропускає — index.html. Нова мова nginx не потребує.
map $arg_lang $smc_og_lang {
    default "";
    "~^(?<og_lang_code>[a-z]{2,3})(?:[-_][A-Za-z0-9]+)?$" $og_lang_code;
}
